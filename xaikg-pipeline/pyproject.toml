[project]
name = "xaikg"
version = "0.1.0"
description = "Runtime and data layer of the XAI-KG artefact (corpus acquisition, LLM extraction, graph loading, ML, explanation service, evaluation). All model-dependent logic is generated by xaikg-mde; this package never re-implements a transformation, a validation rule or a constraint."
requires-python = ">=3.12"
dependencies = [
    "pyecore==0.15.1",
    "httpx==0.27.2",
    "openai==1.59.6",
    "python-dotenv==1.0.1",
    "neo4j==5.27.0",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "shap==0.46.0",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "lxml==5.3.0",
    "typer==0.15.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
xaikg = "xaikg.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xaikg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
